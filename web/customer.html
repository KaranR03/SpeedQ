<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beacon Assist · Customer</title>
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/customer.js"></script>
</head>
<body class="cust">
  <aside class="picker demo-panel" id="picker" aria-label="Demo controls">
    <div class="dp-head">
      <div><div class="dp-title">Demo controls</div><div class="dp-sub">Synthetic customers · not shown in the app</div></div>
      <button class="dp-close" id="dpClose" aria-label="Hide demo controls" title="Hide (D)">‹</button>
    </div>
    <div class="dp-sec">Signed in as</div>
    <div class="dp-list" id="dpCustomers"></div>
    <div class="dp-sec">Scripted scenes <span class="dp-tag">fallback</span></div>
    <div class="dp-scenes" id="dpScenes"></div>
    <div class="dp-foot">Press <kbd>D</kbd> to hide or show this panel.</div>
  </aside>
  <button class="dp-tab" id="dpTab" aria-label="Show demo controls" title="Show demo controls (D)">Demo</button>
  <div class="phone">
    <div class="ph-top">
      <div class="row1"><b>Help</b><span class="ai" title="You are talking to an AI">AI</span>
        <span class="muted small">Clario, an AI assistant</span>
        <button class="person" id="person">Talk to a person</button></div>
      <div class="ph-tabs"><button class="on" data-v="chat">Chat</button><button data-v="card" id="cardTab">My card</button></div>
    </div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="quick" id="quick"></div>
    <div class="cardview hidden" id="cardview"></div>
    <div class="sim" id="sim">Demo customer · synthetic data · no real money moves</div>
  </div>
</body>
</html>
